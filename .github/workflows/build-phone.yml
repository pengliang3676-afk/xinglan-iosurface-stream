name: build-xinglan-iosurface-stream

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: RootHide
            scheme: roothide
          - name: Dopamine-Rootless
            scheme: rootless
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
        run: |
          brew install ldid xz
          git clone --recursive --depth 1 https://github.com/roothide/theos.git "$HOME/theos"

      - name: Build ${{ matrix.name }} package
        env:
          THEOS: ${{ runner.temp }}/theos-link
        run: |
          ln -s "$HOME/theos" "$THEOS"
          if [ "${{ matrix.scheme }}" = "rootless" ]; then
            /usr/libexec/PlistBuddy -c \
              "Set :ProgramArguments:0 /var/jb/Applications/XLStream.app/bin/xlstreamd" \
              phone/layout/Library/LaunchDaemons/com.jibeib.xlstreamd.plist
          fi
          make -C phone clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=${{ matrix.scheme }}

      - name: Collect package
        run: |
          mkdir -p output
          version="$(awk '/^Version:/{print $2}' phone/control)"
          package="$(find phone/packages -name '*.deb' -print -quit)"
          test -n "$package"
          cp "$package" "output/XLStream-${version}-${{ matrix.name }}.deb"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: XLStream-${{ matrix.name }}
          path: output/*.deb
          if-no-files-found: error
