name: build-xinglan-iosurface-stream

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
        run: |
          brew install ldid xz
          git clone --recursive --depth 1 https://github.com/roothide/theos.git "$HOME/theos"

      - name: Build rootless package
        env:
          THEOS: ${{ runner.temp }}/theos-link
        run: |
          ln -s "$HOME/theos" "$THEOS"
          make -C phone clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide

      - name: Collect package
        run: |
          mkdir -p output
          version="$(awk '/^Version:/{print $2}' phone/control)"
          package="$(find phone/packages -name '*.deb' -print -quit)"
          test -n "$package"
          cp "$package" "output/XLStream-${version}.deb"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: XLStream-rootless
          path: output/*.deb
          if-no-files-found: error
