name: build-xinglan-iosurface-stream

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "phone/**"
      - "tests/test_phone_package_safety.py"
      - ".github/workflows/build-phone.yml"

env:
  TROLLVNC_REPOSITORY: https://github.com/pengliang3676-afk/TrollVNC.git
  TROLLVNC_COMMIT: 57af31e1eb204251d21d681503fa3f0765a8fd96

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify package source safety
        run: python3 -m unittest tests.test_phone_package_safety

      - name: Install build dependencies
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          brew install ldid xz dpkg
          git clone --recursive --depth 1 https://github.com/roothide/theos.git "$HOME/theos"
          export THEOS="$HOME/theos"
          "$HOME/theos/bin/install-sdk" iPhoneOS16.5

      - name: Build XLStream RootHide package
        env:
          THEOS: ${{ runner.temp }}/theos-link
        run: |
          ln -s "$HOME/theos" "$THEOS"
          make -C phone clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide

      - name: Build pinned silent TrollVNC RootHide payload
        env:
          THEOS: ${{ runner.temp }}/theos-link
        run: |
          git clone --recursive "$TROLLVNC_REPOSITORY" trollvnc-source
          git -C trollvnc-source checkout --detach "$TROLLVNC_COMMIT"
          test "$(git -C trollvnc-source rev-parse HEAD)" = "$TROLLVNC_COMMIT"
          make -C trollvnc-source clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide

      - name: Assemble one RootHide integrated package
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk '/^Version:/{print $2}' phone/control)"
          stream_package="$(find phone/packages -name '*.deb' -print -quit)"
          troll_package="$(find trollvnc-source/packages -name '*.deb' -print -quit)"
          test -n "$stream_package"
          test -n "$troll_package"

          stage="$(mktemp -d)"
          mkdir -p "$stage/root" "$stage/troll" "$stage/root/DEBIAN" output
          dpkg-deb -x "$stream_package" "$stage/root"
          dpkg-deb -x "$troll_package" "$stage/troll"
          install -Dm755 "$stage/troll/usr/bin/trollvncserver" \
            "$stage/root/usr/bin/trollvncserver"
          install -Dm644 \
            "$stage/troll/Library/LaunchDaemons/com.82flex.trollvnc.plist" \
            "$stage/root/Library/LaunchDaemons/com.82flex.trollvnc.plist"
          install -Dm644 trollvnc-source/COPYING \
            "$stage/root/Applications/XLStream.app/TrollVNC_GPLv2_LICENSE.txt"
          install -m644 phone/control "$stage/root/DEBIAN/control"

          output="output/星澜TP-TrollVNC静默整合版_RootHide_${version}.deb"
          dpkg-deb --root-owner-group -Zxz --build "$stage/root" "$output"

      - name: Upload integrated RootHide package
        uses: actions/upload-artifact@v4
        with:
          name: XingLan-RootHide-Integrated
          path: output/*.deb
          if-no-files-found: error

  verify-packages:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download integrated RootHide package
        uses: actions/download-artifact@v4
        with:
          name: XingLan-RootHide-Integrated
          path: packages

      - name: Verify metadata, payload and removed native touch
        shell: bash
        run: |
          set -euo pipefail
          package="$(find packages -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$package"
          test "$(find packages -maxdepth 1 -name '*.deb' | wc -l)" -eq 1

          verify_dir="$(mktemp -d)"
          root="$verify_dir/root"
          mkdir -p "$root"
          dpkg-deb --control "$package" "$verify_dir/control-dir"
          control="$verify_dir/control-dir/control"
          grep -qx 'Package: com.jibeib.xlstream.safe' "$control"
          grep -qx 'Version: 0.9.0' "$control"
          grep -qx 'Architecture: iphoneos-arm64e' "$control"
          grep -qx 'Provides: com.jibeib.xlstream, com.82flex.trollvnc' "$control"
          grep -qx 'Replaces: com.jibeib.xlstream, com.82flex.trollvnc' "$control"
          ! grep -Eq '^(Conflicts|Breaks):' "$control"
          for script in preinst postinst prerm postrm config; do
            test ! -e "$verify_dir/control-dir/$script"
          done

          dpkg-deb -x "$package" "$root"
          test -x "$root/Applications/XLStream.app/bin/xlstreamd"
          test -e "$root/Library/MobileSubstrate/DynamicLibraries/XLSystemActions.dylib"
          test -x "$root/usr/bin/trollvncserver"
          test -e "$root/Library/LaunchDaemons/com.82flex.trollvnc.plist"
          test -e "$root/Applications/XLStream.app/TrollVNC_GPLv2_LICENSE.txt"
          test ! -e "$root/Applications/XLStream.app/bin/xltouchd"
          test ! -e "$root/Library/PreferenceBundles/TrollVNCPrefs.bundle"
          test ! -e "$root/Library/ControlCenter/Bundles/CCTrollVNC.bundle"
          test ! -e "$root/usr/share/trollvnc/webclients"

          ! strings "$root/Applications/XLStream.app/bin/xlstreamd" | grep -q 'sendTouchPhase'
          ! strings "$root/Applications/XLStream.app/bin/xlstreamd" | grep -q 'IOHIDEventCreateDigitizerEvent'
          ! strings "$root/Applications/XLStream.app/bin/xlstreamd" | grep -q 'IOHIDEventCreateDigitizerFingerEvent'

      - name: Verify Replaces migration bypasses legacy prerm
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          old="$root/old"
          new="$root/new"
          mkdir -p "$old/DEBIAN" "$old/opt/xlstream-migration-ci"
          mkdir -p "$new/DEBIAN" "$new/opt/xlstream-migration-ci"
          cat > "$old/DEBIAN/control" <<'EOF'
          Package: com.jibeib.xlstream-ci-old
          Version: 1.0
          Architecture: all
          Maintainer: XLStream CI
          Description: migration test old package
          EOF
          cat > "$old/DEBIAN/prerm" <<'EOF'
          #!/bin/sh
          touch /tmp/xlstream-old-prerm-ran
          exit 99
          EOF
          chmod 755 "$old/DEBIAN/prerm"
          echo old > "$old/opt/xlstream-migration-ci/payload"
          cat > "$new/DEBIAN/control" <<'EOF'
          Package: com.jibeib.xlstream-ci-safe
          Version: 2.0
          Architecture: all
          Maintainer: XLStream CI
          Provides: com.jibeib.xlstream-ci-old
          Replaces: com.jibeib.xlstream-ci-old
          Description: migration test safe package
          EOF
          echo new > "$new/opt/xlstream-migration-ci/payload"
          dpkg-deb --build "$old" "$root/old.deb"
          dpkg-deb --build "$new" "$root/new.deb"
          sudo dpkg -i "$root/old.deb"
          sudo dpkg -i "$root/new.deb"
          test ! -e /tmp/xlstream-old-prerm-ran
          test "$(cat /opt/xlstream-migration-ci/payload)" = new
          ! dpkg-query -W -f='${db:Status-Abbrev}' com.jibeib.xlstream-ci-old 2>/dev/null | grep -q '^ii'
          sudo dpkg --purge com.jibeib.xlstream-ci-safe
